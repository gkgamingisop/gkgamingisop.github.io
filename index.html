
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GK Gaming | Official Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #151515;
    color: #F5F5F5;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

header {
    padding: 18px 7%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 100px;
}

.logo {
    width: 175px;
    height: auto;
    object-fit: contain;
}

.discord-button {
    position: absolute;
    right: 7%;
    top: 50%;
    transform: translateY(-50%);
    text-decoration: none;
    color: #FFFFFF;
    background: #D96A29;
    padding: 12px 20px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    transition: 0.3s ease;
}

.discord-button:hover {
    background: #F07832;
    transform: translateY(-50%) translateY(-3px);
    box-shadow: 0 5px 20px rgba(240,120,50,0.2);
}

.discord-button span {
    margin-left: 7px;
    font-size: 16px;
}

main {
    min-height: 65vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 35px 7% 45px;
}

.development {
    color: #F07832;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 5px;
    text-align: center;
    margin-bottom: 18px;
}

h1 {
    color: #FFFFFF;
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 700;
    letter-spacing: 2px;
    text-align: center;
}

.subtitle {
    color: #A5A5A5;
    font-size: 15px;
    margin-top: 14px;
    text-align: center;
}

.navigation {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    width: 100%;
    max-width: 850px;
    margin-top: 65px;
}

.nav-card {
    text-decoration: none;
    color: #F5F5F5;
    background: #202020;
    border: 1px solid #333333;
    border-radius: 10px;
    padding: 25px 16px;
    text-align: center;
    transition: 0.3s ease;
}

.nav-card:hover {
    border-color: #F07832;
    background: #29211C;
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

.nav-card h2 {
    font-size: 15px;
    letter-spacing: 1px;
}

.nav-card p {
    color: #999999;
    font-size: 12px;
    margin-top: 10px;
}

footer {
    text-align: center;
    color: #777777;
    font-size: 12px;
    padding: 25px;
    letter-spacing: 2px;
}

@media (max-width: 600px) {
    header {
        padding: 18px 5%;
        flex-direction: column;
        gap: 15px;
    }

    .logo {
        width: 155px;
    }

    .discord-button {
        position: static;
        transform: none;
    }

    .discord-button:hover {
        transform: translateY(-3px);
    }

    .navigation {
        grid-template-columns: 1fr;
        max-width: 350px;
        margin-top: 40px;
    }

    main {
        padding-top: 25px;
    }
}
</style>
</head>

<body>

<header>
    <img src="dccc7b68601b277504ee1adb317e885d.webp"
         alt="GK Gaming Logo" class="logo">

    <a href="https://discord.gg/SZFxAamC3Y"
       class="discord-button"
       target="_blank"
       rel="noopener noreferrer">
        JOIN DISCORD <span>→</span>
    </a>
</header>

<main>
    <p class="development">UNDER DEVELOPMENT</p>

    <h1>Something New Is Coming.</h1>

    <p class="subtitle">
        We're building something special for our community.
    </p>

    <nav class="navigation">

        <a href="about.html" class="nav-card">
            <h2>ABOUT US</h2>
            <p>Discover GK Gaming</p>
        </a>

        <a href="marketplace.html" class="nav-card">
            <h2>MARKETPLACE</h2>
            <p>Explore our marketplace</p>
        </a>

        <a href="gk-plus.html" class="nav-card">
            <h2>GK+</h2>
            <p>Discover exclusive experiences</p>
        </a>

    </nav>
</main>

<footer>
    GK GAMING &nbsp; | &nbsp; EST. 2026
</footer>

</body>
</html>
